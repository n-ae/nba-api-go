name: Live drift

# Scheduled live-traffic smoke test against stats.nba.com, kept out of the
# main CI workflow on purpose: these tests hit an unofficial, undocumented,
# rate-limiting upstream that can change or 404 without notice, so they must
# not gate pushes/PRs. Their value is catching upstream schema drift (a
# result set renamed, a column inserted/reordered) before a consumer does -
# exactly the class of bug that hid in LeagueLeaders until it was checked
# live. See the CI workflow's header comment, which anticipates this file.
on:
  # Weekly is enough for an API that changes on the order of a season, not a
  # day, and keeps request volume low so the environment is less likely to be
  # rate-limited (the same throttling noted in CHANGELOG's [2.1.0]).
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  # Manual trigger for on-demand checks (e.g. after an NBA.com announcement,
  # or to reproduce a suspected drift) without waiting for the weekly run.
  workflow_dispatch:

# A red run here is a signal to triage, NOT an automatic "the SDK is broken":
# distinguish a transient upstream failure (network error, 429/rate limit,
# 5xx, an offseason 404) from a real schema/header mismatch by reading the
# test log before acting. This workflow deliberately does not open issues or
# notify - it would be noise for every transient NBA.com hiccup. If a failure
# is real drift, follow docs/MAINTENANCE.md's "When Tests Fail" procedure.
#
# Scope deliberately narrowed to LeagueLeaders/InternationalBroadcasterSchedule
# (see the -run pattern below), not the full tests/integration/... smoke
# suite. Confirmed with two independent manual runs on 2026-07-21 (workflow
# runs 29865194310 and 29865360637, ~2 minutes apart) that PlayerCareerStats
# and PlayerGameLog silently hang to the exact 30s client timeout, and the
# live Scoreboard's cdn.nba.com call gets an instant, identical Akamai
# "Access Denied" - both patterns repeated byte-for-byte across the two runs,
# which is a structural GitHub Actions-runner-IP block, not transient
# throttling. Including them here would make this workflow reliably red on
# every scheduled run regardless of actual SDK/schema health, defeating its
# purpose. They're still exercised by the full `INTEGRATION_TESTS=1` suite
# for local/manual runs, where a developer's residential/office IP may not be
# blocked - see tests/integration/README.md's "Known live-traffic blocks"
# section. Re-evaluate this narrowing if NBA.com's blocking behavior changes.

# Least-privilege default: this job only reads the checkout and runs tests
# against an external API - it never writes anything back to the repository.
permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    # Bounded so a hung upstream request can't keep a runner busy indefinitely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: live smoke tests
        env:
          INTEGRATION_TESTS: "1"
        # -count=1 defeats the test cache so every scheduled run actually
        # re-hits stats.nba.com rather than replaying a cached pass.
        # -run scopes to the subtests confirmed reachable from GitHub
        # Actions runners - see the job-level comment above.
        run: go test -count=1 -v -run 'TestSimpleSmokeTests/(LeagueLeaders|InternationalBroadcasterSchedule)' ./tests/integration/...
