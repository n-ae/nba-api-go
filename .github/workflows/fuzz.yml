name: Fuzz

# Scheduled coverage-guided fuzzing for pkg/client's BaseURL
# secret-disclosure invariant (FuzzNewClientErrorDoesNotEchoInput), kept
# out of the main CI workflow on purpose: ordinary `go test ./...` only
# replays the fuzz target's seed corpus, not ongoing mutation, so it
# can't find anything this job can. Recommended across three consecutive
# maintainability-assessment cycles (f4801ef, eb62a41, 8e85a9c) before
# finally being added here rather than carried forward a fourth time -
# see docs/MAINTAINABLE_ARCHITECT_V4_ASSESSMENT.md.
on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:

# Least-privilege default: this job only reads the checkout, fuzzes, and
# (on failure) uploads an artifact - it never writes anything back to the
# repository itself.
permissions:
  contents: read

# Scheduled daily plus manually dispatchable - serializes an ad-hoc
# manual dispatch against the next day's scheduled run (or another manual
# one) so they don't consume duplicate Actions minutes and don't produce
# two overlapping "is this a real invariant failure or not" signals to
# triage at once. This is NOT preventing a shared-filesystem race on
# testdata/fuzz/ - GitHub-hosted jobs each run in their own fresh VM (see
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners),
# so two separate workflow runs never share a local corpus directory in
# the first place; an earlier version of this comment claimed otherwise,
# which was wrong. cancel-in-progress: false, not true - a fuzz run
# that's found something and is mid-upload shouldn't be killed by a newer
# run starting; queueing behind it is cheap given the 5-minute timeout
# below. Found by the 2026-07-23 (7d6702b) maintainability assessment
# (finding #17) - the inaccurate rationale was introduced in this same
# session's PR #81, which added this block in the first place.
concurrency:
  group: baseurl-fuzz
  cancel-in-progress: false

# If the "fuzz BaseURL error non-disclosure invariant" step below fails
# with a "fuzz-failure-corpus" artifact attached, that's a real finding -
# the fuzzer found a BaseURL that makes NewClient leak part of itself
# into the returned error, not a flaky test. To act on it: download the
# artifact, copy its file into
# pkg/client/testdata/fuzz/FuzzNewClientErrorDoesNotEchoInput/, fix the
# underlying leak, and commit the corpus file alongside the fix - ordinary
# `go test` always replays any file already present under testdata/fuzz/,
# so the specific failing case is a permanent regression test from then on
# without needing to fuzz again to rediscover it.
#
# A red run with no artifact (checkout failed, setup-go failed, a runner
# outage, the 5-minute timeout below) is an infrastructure failure, not an
# invariant violation - triage it the same way as any other CI failure,
# not as a security finding. Found by the 2026-07-22 (0e35c33)
# maintainability assessment: the wording used to say "a red run here
# means... a real finding" without this distinction.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Bounded so a stuck fuzz run can't occupy a runner indefinitely; -fuzztime
    # below (60s) is the actual budget, this is just a hard backstop.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: fuzz BaseURL error non-disclosure invariant
        id: fuzz
        # -run=^$ skips ordinary tests in this invocation (they already
        # run in ci.yml on every push/PR); -fuzztime bounds this to a
        # fixed, predictable cost per run rather than running indefinitely.
        # 60s found nothing across 2M+ local executions during this
        # invariant's development (see CHANGELOG's v3.1.4-v3.1.7 entries),
        # so this job exists to catch a *future* regression, not to
        # re-discover already-fixed gaps.
        working-directory: pkg/client
        run: go test -run=^$ -fuzz=FuzzNewClientErrorDoesNotEchoInput -fuzztime=60s .

      - name: upload failing corpus
        # Scoped to this step's own outcome, not the job's overall
        # failure() alone - a checkout or setup-go failure earlier in the
        # job would also satisfy failure(), but pkg/client/testdata/fuzz/
        # wouldn't contain a new failing case in that scenario, producing
        # a misleading empty/stale artifact. Found by the 2026-07-22
        # (0e35c33) maintainability assessment.
        #
        # failure() is still required here despite the extra
        # steps.fuzz.outcome check: GitHub Actions implicitly ANDs a
        # bare `if:` with success() unless the expression contains an
        # explicit status-check function, so without failure() this
        # condition was `success() && steps.fuzz.outcome == 'failure'` -
        # never true, since the fuzz step failing already puts the job
        # in a failed state by the time this step evaluates. Found by
        # the 2026-07-22 (e3ee47c) maintainability assessment: the prior
        # cycle's fix (0e35c33 -> e3ee47c) added the outcome check but
        # dropped the required failure() override, silently disabling
        # the entire corpus-upload mechanism it was meant to scope.
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-corpus
          path: pkg/client/testdata/fuzz/
          retention-days: 30
          # A genuine invariant failure always writes a corpus file before
          # go test's fuzz runner exits nonzero (this is stdlib fuzzing
          # behavior, not something this workflow controls) - so an upload
          # that finds nothing here on a real fuzz-step failure is itself
          # worth flagging, not silently skipping.
          if-no-files-found: warn
