name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deliberately boring: one job, one Go version (whatever go.mod declares),
# no matrix. Live/integration tests are opt-in via INTEGRATION_TESTS=1 and
# are not run here - they hit stats.nba.com and belong in a separate,
# scheduled workflow, not on every push/PR.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        # v6 of this action only supports golangci-lint v1.x and rejects a
        # v2.x version string outright; .golangci.yml here is the v2
        # config schema, so v7 is required, not optional.
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": on v6 (before the v7 bump above),
          # "latest" silently resolved to the newest *v1.x* release
          # (v1.64.8, built with Go 1.24), which then refused to lint a
          # module declaring go 1.26.5 - the same class of toolchain
          # mismatch this project's own CHANGELOG flags elsewhere. Pin to
          # a version verified locally against this module
          # (`golangci-lint version`) and bump deliberately.
          version: v2.12.2

      - name: test-examples
        run: make test-examples

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build generator tool
        working-directory: tools/generator
        run: go build ./...
