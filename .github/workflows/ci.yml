name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deliberately boring: one job, one Go version (whatever go.mod declares),
# no matrix. Live/integration tests are opt-in via INTEGRATION_TESTS=1 and
# are not run here - they hit stats.nba.com and belong in a separate,
# scheduled workflow, not on every push/PR.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        # Scoped to the packages with meaningful concurrency (shared
        # clients, middleware, background health polling, per-IP rate
        # limiting) rather than ./... - keeps runtime bounded while still
        # covering everywhere a data race would actually matter.
        run: go test -race ./pkg/client/... ./pkg/stats/... ./pkg/live/... ./cmd/nba-api-server/...

      - name: golangci-lint
        # v6 of this action only supports golangci-lint v1.x and rejects a
        # v2.x version string outright; .golangci.yml here is the v2
        # config schema, so v7+ is required, not optional. (Bumped 7->9
        # by Dependabot, PR #1 - all checks passed before merge.)
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": on v6, "latest" silently resolved to
          # the newest *v1.x* release (v1.64.8, built with Go 1.24),
          # which then refused to lint a module declaring go 1.26.5 - the
          # same class of toolchain mismatch this project's own CHANGELOG
          # flags elsewhere. Pin to a version verified locally against
          # this module (`golangci-lint version`) and bump deliberately -
          # Dependabot will propose bumps here too; verify against a real
          # CI run before merging, not just the action version above.
          version: v2.12.2

      - name: test-examples
        run: make test-examples

      - name: govulncheck
        # Pinned, not "@latest": an unpinned tool version can change what a
        # build checks (and whether it passes) with no repository change at
        # all - the same class of problem golangci-lint-action's version
        # pin above exists to prevent. Bump deliberately (Dependabot will
        # propose gomod bumps, but this is a `go run` tool version, not a
        # go.mod dependency, so it must be bumped here by hand).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # tools/generator is a separate Go module (its own go.mod, not part
      # of the root module's package tree - see docs/MAINTAINABLE_ARCHITECT_V4_ASSESSMENT_2026-07-19_2363f46.md
      # finding #10), so it needs its own vet/test/lint/build steps rather
      # than being reached by the root module's `go vet ./...`/`go test
      # ./...`/golangci-lint runs above.
      - name: generator go vet
        working-directory: tools/generator
        run: go vet ./...

      - name: generator go test
        working-directory: tools/generator
        run: go test ./...

      - name: generator golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tools/generator

      - name: build generator tool
        working-directory: tools/generator
        run: go build ./...
