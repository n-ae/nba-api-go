name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deliberately boring: one job, one Go version (whatever go.mod declares),
# no matrix. Live/integration tests are opt-in via INTEGRATION_TESTS=1 and
# are not run here - they hit stats.nba.com and belong in a separate,
# scheduled workflow, not on every push/PR.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned, not "latest": with install-mode: binary (the action's
          # default), "latest" resolved to a stale v1.64.8 build (Go 1.24)
          # that refuses to lint a module declaring go 1.26.5 - the same
          # class of toolchain mismatch this project's own CHANGELOG flags
          # elsewhere. Pin to a version verified locally against this
          # module (`golangci-lint version`) and bump deliberately.
          version: v2.12.2

      - name: test-examples
        run: make test-examples

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build generator tool
        working-directory: tools/generator
        run: go build ./...
