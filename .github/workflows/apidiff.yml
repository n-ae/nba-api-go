name: API Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Lets a stale red run (from before a new tag caught up to a merged
    # const/value-only change - see the "not automatically wrong" note
    # below) be re-checked on demand without waiting for the next real
    # push, instead of leaving main's status stuck red between releases.

# Fails if the module's public API changed incompatibly since the latest
# tagged release, using golang.org/x/exp/cmd/apidiff. Addresses the
# "no apidiff/semver-break gate in CI" finding carried in every
# maintainable-architect-v4 assessment since 2026-07-19 - an accidental
# breaking change (renamed/removed exported identifier, changed function
# signature, ...) previously wasn't caught until a consumer's build broke
# after upgrading.
#
# A red result here isn't automatically wrong: this project has shipped
# deliberate breaking changes before (v2.0.0, and the source-breaking
# v1.2.0 minor - see CLAUDE.md's Versioning/API Stability section). When
# that's the case, this job is expected to fail, and the PR needs a
# major version bump, a CHANGELOG migration guide, and updated examples
# before release - not a bypass of this check.

# Least-privilege default: this job only reads the checkout and installs a
# tool, it never needs to write anything back to the repository.
permissions:
  contents: read

jobs:
  apidiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need tag history, not just the current commit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install apidiff
        # Pinned, not "@latest": golang.org/x/exp has no semver tags, only
        # pseudo-versions, so an unpinned install can silently change what
        # "the API" means with no repository change at all - the same
        # rationale as govulncheck's and golangci-lint's pins in ci.yml.
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260718201538-764159d718ef

      - name: Find latest release tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Check out latest release into a worktree
        run: git worktree add /tmp/old-release "${{ steps.tag.outputs.tag }}"

      - name: Export old API
        # go mod download first: apidiff -m fails to resolve the module's
        # dependencies without it ("does not contain main module or its
        # selected dependencies"), reproduced locally against this exact
        # command.
        run: |
          cd /tmp/old-release
          go mod download
          apidiff -m -w /tmp/old.export /tmp/old-release

      - name: Export current API
        run: |
          go mod download
          apidiff -m -w /tmp/new.export "${{ github.workspace }}"

      - name: Compare
        run: |
          echo "Comparing ${{ steps.tag.outputs.tag }} -> $(git rev-parse --short HEAD)"
          echo
          apidiff -m /tmp/old.export /tmp/new.export

          incompatible="$(apidiff -m -incompatible /tmp/old.export /tmp/new.export)"
          if [ -n "$incompatible" ]; then
            echo
            echo "::error::Incompatible API changes since ${{ steps.tag.outputs.tag }} - see CLAUDE.md's Versioning/API Stability section. If intentional, this needs a major version bump, CHANGELOG migration guide, and updated examples before release."
            exit 1
          fi
