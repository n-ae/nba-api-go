name: Release Install Smoke Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (e.g. v2.2.0) - defaults to the latest tag when run manually'
        required: false

# Verifies the module is actually fetchable and usable by an external
# consumer at the tag just pushed, not just that this repo's own checkout
# builds - the tag-triggered CI / install smoke test gap carried in every
# maintainable-architect-v4 assessment. v2.0.0 and v2.1.0 both shipped
# genuinely unfetchable via `go get` (a module-path mismatch caught by hand,
# days later, not by CI - see CHANGELOG.md's [2.1.1] section), because
# nothing here ever did what a real consumer does: `go get` the tagged
# module into a clean module cache and build against it. This job is that
# check, automated, running on every tag push instead of relying on a
# maintainer remembering to do it manually before/after every release.

# Least-privilege default: this job only reads the checkout, fetches a
# module, and builds/runs a scratch program - it never writes anything
# back to the repository.
permissions:
  contents: read

jobs:
  install-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow (fetch-depth: 1) clone -
          # the "Resolve tag under test" step's `git describe --tags
          # --abbrev=0` fallback needs tag history reachable from HEAD to
          # find anything. A shallow checkout has none, so that fallback
          # failed with "fatal: No names found, cannot describe anything."
          # on the first real workflow_dispatch-with-no-input run after
          # finding #15's fix made this fallback reachable at all - it was
          # never actually exercised before, so this was latent too.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve tag under test
        # Keyed off github.event_name, not an empty-string fallback chain:
        # on a workflow_dispatch, github.ref_name is the branch it was run
        # on (e.g. "main"), not a tag - it's only ever empty on a tag push,
        # where ref_name is correctly the tag name itself. The prior
        # fallback chain (input -> ref_name -> git describe) meant a manual
        # dispatch with no tag input silently used ref_name ("main") and
        # never reached the "latest tag" fallback its own input description
        # promises, since ref_name is never actually empty on a
        # workflow_dispatch. Found by the 2026-07-23 (04537f4) maintainability
        # assessment (finding #15) - latent in every real dispatch so far,
        # since each one has passed an explicit tag.
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
            if [ -z "$tag" ]; then
              tag="$(git describe --tags --abbrev=0)"
            fi
          else
            tag="${{ github.ref_name }}"
          fi
          echo "Verifying tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: go get the tagged module into a scratch module
        # A fresh module outside this checkout (not this repo's own go.mod)
        # so nothing here - a replace directive, the local module cache
        # already having this exact code, GOFLAGS - can mask a real
        # fetchability problem. This has to look exactly like an external
        # consumer's first `go get`.
        #
        # Retries with backoff: sum.golang.org has, twice in a row
        # (v3.1.10, v3.1.11), returned a transient 500 for the freshly
        # pushed tag's checksum for roughly a minute immediately after tag
        # push, resolving on its own both times (confirmed by directly
        # curling proxy.golang.org/sum.golang.org moments later, not just
        # by re-running this job). A single-attempt gate turns that
        # ordinary propagation delay into a spurious release-time failure
        # requiring a manual rerun every release. Bounded at 5 attempts
        # (15/30/45/60s backoff, ~2.5 minutes worst case) so a genuinely
        # unfetchable release still fails this job, not retries forever.
        run: |
          mkdir -p /tmp/install-smoke
          cd /tmp/install-smoke
          go mod init smoke-test

          for attempt in 1 2 3 4 5; do
            if go get "github.com/n-ae/nba-api-go/v3@${{ steps.tag.outputs.tag }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "go get failed after $attempt attempts" >&2
              exit 1
            fi
            echo "go get failed (attempt $attempt/5), retrying in $((attempt * 15))s..." >&2
            sleep $((attempt * 15))
          done

      - name: Build and run a program against the fetched module
        run: |
          cat > /tmp/install-smoke/main.go <<'EOF'
          package main

          import (
                  "fmt"

                  "github.com/n-ae/nba-api-go/v3/pkg/stats"
                  "github.com/n-ae/nba-api-go/v3/pkg/stats/static"
          )

          func main() {
                  // Deliberately no network calls - this only needs to prove
                  // the module is fetchable, buildable, and its exported API
                  // is usable exactly as an external consumer would use it.
                  // stats.NewDefaultClient has no error return on every
                  // released version to date (see CHANGELOG.md's [Unreleased]
                  // Migration guide), so this stays stable across the tags
                  // this workflow will be asked to verify.
                  client := stats.NewDefaultClient()
                  if client == nil {
                          panic("stats.NewDefaultClient() returned nil")
                  }
                  players, err := static.SearchPlayers("lebron")
                  if err != nil {
                          panic(err)
                  }
                  fmt.Printf("install smoke test OK: %d player(s) matched, client constructed\n", len(players))
          }
          EOF
          cd /tmp/install-smoke
          # go get above only adds the direct requirement; go mod tidy pulls
          # in the transitive go.sum entries (golang.org/x/text,
          # golang.org/x/time) a real consumer's own `go mod tidy` would add
          # on first build - without it, `go build` fails on missing go.sum
          # entries that have nothing to do with this module's own health.
          go mod tidy
          go build -o smoke-test .
          ./smoke-test
