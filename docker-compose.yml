version: '3.8'

services:
  nba-api:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=info
      # NBA_API_TIMEOUT is not currently read by cmd/nba-api-server; this
      # line documents the intended knob but has no effect. See
      # docs/adr/002-api-server-architecture.md and the current
      # maintainability assessment.
      - NBA_API_TIMEOUT=30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
